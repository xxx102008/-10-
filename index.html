<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>טיימר</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: #fff;
  }
  /* תמונת הרקע בשכבה נפרדת שנמצאת תמיד מאחורי כל התוכן */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image: url('https://play-lh.googleusercontent.com/is1KpW8qM1k0k09yn9I5C4cSnCmuLLwmXG9kLVF4p0gj07PeoYJgbs4wYJYK7KQJhjwr86T5C3scWQC_eQoByw=w526-h296-rw');
    background-size: cover;
    background-position: center;
    opacity: 0.45; /* שקיפות התמונה: 0 = שקוף לגמרי, 1 = רגיל */
  }
  .title, .timer, #nextBtn { position: relative; z-index: 1; }
  .title {
  const m = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
  const s = (totalSeconds % 60).toString().padStart(2, "0");
  return m + ":" + s;
}

function render() {
  const remaining = secondsRemaining();
  document.getElementById("timerDisplay").textContent = formatTime(remaining);
  // הכפתור מופיע רק כשהטיימר נגמר
  document.getElementById("nextBtn").classList.toggle("hidden", remaining > 0);
}

document.getElementById("nextBtn").addEventListener("click", () => {
  document.getElementById("errorScreen").classList.remove("hidden");
});

function startTicking() {
  if (tickInterval) clearInterval(tickInterval);
  tickInterval = setInterval(render, 1000);
}

// חזרה מהרקע - חישוב מחדש מול הזמן האמיתי שחלף
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") render();
});

render();
startTicking();
</script>

</body>
</html>
