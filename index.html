<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טיימר</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background-image: url('https://play-lh.googleusercontent.com/is1KpW8qM1k0k09yn9I5C4cSnCmuLLwmXG9kLVF4p0gj07PeoYJgbs4wYJYK7KQJhjwr86T5C3scWQC_eQoByw=w526-h296-rw');
    background-size: cover;
    background-position: center;
  }
  .title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 24px;
    text-align: center;
    padding: 0 20px;
  }
  .timer {
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-bottom: 32px;
  }
  button {
    font-size: 18px;
    padding: 14px 40px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
</style>
</head>
<body>

  <div class="title">שהזמן יגמר תוכלו להמשיך</div>
  <div class="timer" id="timerDisplay">10:00</div>
  <button id="nextBtn" disabled>הבא</button>

<script>
/*
  הגדרה - משך הטיימר בשניות. לשינוי בהמשך.
*/
const DURATION_SECONDS = 10 * 60;

const STORAGE_KEY = "timer_screen_end_time";

// זמן הסיום נשמר כ-timestamp אמיתי (epoch ms), כדי לשרוד סגירה/פתיחה מחדש
// של האפליקציה ומעבר לרקע. בכל render מחשבים מחדש לפי Date.now() הנוכחי,
// כך שאין תלות ברצף ריצה של טיימר JS ברקע (שבכל מקרה לא מובטח לרוץ
// כשהאפליקציה לא בחזית).
let endTime = loadEndTime();
let tickInterval = null;

function loadEndTime() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) return parseInt(stored, 10);
  const fresh = Date.now() + DURATION_SECONDS * 1000;
  localStorage.setItem(STORAGE_KEY, fresh);
  return fresh;
}

function secondsRemaining() {
  return Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
}

function formatTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
  const s = (totalSeconds % 60).toString().padStart(2, "0");
  return m + ":" + s;
}

function render() {
  const remaining = secondsRemaining();
  document.getElementById("timerDisplay").textContent = formatTime(remaining);
  document.getElementById("nextBtn").disabled = remaining > 0;
}

function startTicking() {
  if (tickInterval) clearInterval(tickInterval);
  tickInterval = setInterval(render, 1000);
}

// חזרה מהרקע - חישוב מחדש מול הזמן האמיתי שחלף
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") render();
});

render();
startTicking();
</script>

</body>
</html>
